spring:
  application:
    name: friperie-gestion
  datasource:
    url: jdbc:postgresql://localhost:5432/friperie_db
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: update   # à remplacer par "validate" + Flyway/Liquibase en production
    show-sql: false
    properties:
      hibernate:
        format_sql: true

jwt:
  # Clé secrète encodée en Base64, utilisée pour signer les access tokens (HS256).
  # NE JAMAIS committer une vraie clé : passez-la en variable d'environnement.
  # Génération d'une clé aléatoire (256 bits) en Base64, exemple en bash :
  #   openssl rand -base64 32
  secret: ${JWT_SECRET:VGhpc0lzQVNlY3JldEtleUZvckpXVFNpZ25pbmdDaGFuZ2VJdEluUHJvZA==}
  access-token-expiration: 900000        # 15 minutes en millisecondes
  refresh-token-expiration: 604800000    # 7 jours en millisecondes
